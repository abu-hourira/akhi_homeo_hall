name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Assets for Mobile
        run: node build-mobile.js

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Copy & Rename APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Akhi_Homeo_Hall.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Akhi_Homeo_Hall_APK
          path: output/Akhi_Homeo_Hall.apk
          retention-days: 90

      - name: Create or Update Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0-mobile
          name: "Akhi Homeo Hall v2.0 Android Mobile App (APK)"
          body: |
            ### 🏥 আঁখি হোমিও হল - অ্যান্ড্রয়েড মোবাইল অ্যাপ (APK)
            
            ✅ **৩-স্তর বিশিষ্ট ডেটা ব্যাকআপ:**
            1. **অফলাইন লোকাল ফোন স্টোরেজ:** ইন্টারনেট ছাড়াও সব রোগীর তথ্য ও প্রেসক্রিপশন সংরক্ষিত থাকবে।
            2. **সেন্ট্রাল ডেটাবেজ:** নেটওয়ার্ক পেলে স্বয়ংক্রিয়ভাবে ডাটা সিঙ্ক হবে।
            3. **গুগল ড্রাইভ অটো-ব্যাকআপ:** এক্সেল (CSV) ও JSON ফরম্যাটে স্বয়ংক্রিয় ড্রাইভ ব্যাকআপ।
            
            📱 **ইনস্টলেশন নির্দেশিকা:**
            1. নিচের `Akhi_Homeo_Hall.apk` ফাইলটি আপনার মোবাইলে ডাউনলোড করুন।
            2. ফাইলটিতে ট্যাপ করে ইনস্টল করুন। (প্রয়োজনে "Install from unknown sources" পারমিশন দিন)।
          files: output/Akhi_Homeo_Hall.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
